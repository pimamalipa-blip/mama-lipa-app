<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mama Lipa</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;padding:20px;text-align:center}
.card{background:white;color:#0f172a;border-radius:20px;padding:24px;max-width:400px;margin:40px auto}
.btn{background:#7c3aed;color:white;border:none;padding:16px;width:100%;border-radius:12px;font-size:18px;font-weight:bold;margin-top:16px}
input{width:100%;padding:14px;border-radius:10px;border:2px solid #ddd;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>Mama Lipa</h1>
<p>Paiement Pi pour Kinshasa</p>
<input id="amount" type="number" value="1">
<input id="memo" type="text" value="Paiement Mama Lipa">
<button class="btn" onclick="pay()">Payer avec Pi</button>
<p id="status"></p>
</div>
<script>
Pi.init({version:"2.0"});
async function pay(){
 let s=document.getElementById('status');
 try{
  let a=await Pi.authenticate(['payments','username'],()=>{});
  s.textContent="Salut @"+a.user.username;
  await Pi.createPayment({amount:1,memo:"Mama Lipa",metadata:{}},{onReadyForServerApproval:(id)=>{s.textContent=id},onReadyForServerCompletion:(id,tx)=>{s.textContent="Paye! "+tx},onCancel:()=>{s.textContent="Annule"},onError:(e)=>{s.textContent=e}});
 }catch(e){s.textContent=e.message}
}
</script>
</body>
</html>
