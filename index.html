<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Appli Lia</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f5f5f5}
button{padding:12px 18px;margin:6px;font-size:16px;border-radius:10px;border:none;background:#7b2ff7;color:white;cursor:pointer}
#boiteLia{background:white;padding:15px;border-radius:12px;margin-top:15px;min-height:80px;text-align:left}
</style>
</head>
<body>

<h2>Bienvenue 👋</h2>
<button onclick="ouvrirLia()">💬 Lia</button>
<div id="boiteLia">Clique sur Lia pour commencer.</div>

<script>
var choixFrancais = "Bonjour ! Je suis Lia, tu parles le Français. Maintenant, choisis ton service ci-dessus : Vodacom, Orange ou Airtel. <button>🎧 Ecouter</button> <button onclick='fermerLia()'>X Fermer</button>";
var choixLingala = "Malonga ! Ngai Lia, olobaka Lingala. Sikoyo ponela service na yo : Vodacom, Orange to Airtel. <button>🎧 Ecouter</button> <button onclick='fermerLia()'>X Fermer</button>";

function ouvrirLia(){
  document.getElementById("boiteLia").innerHTML = "Bonjour ! Je suis Lia, ton assistante. Choisis ta langue : <br><br><button onclick=\"choisirLia('fr')\">Français</button> <button onclick=\"choisirLia('ln')\">Lingala</button> <button onclick='fermerLia()'>X Fermer</button>";
  parlerLia("Bonjour, je suis Lia");
}

function choisirLia(langue){
  if(langue == "fr"){
    document.getElementById("boiteLia").innerHTML = choixFrancais;
  } else {
    document.getElementById("boiteLia").innerHTML = choixLingala;
  }
}

function fermerLia(){
  document.getElementById("boiteLia").innerHTML = "Clique sur Lia pour commencer.";
  try{ speechSynthesis.cancel(); }catch(e){}
}

function parlerLia(texte){
  try{
    speechSynthesis.cancel();
    var voix = new SpeechSynthesisUtterance(texte);
    voix.lang = "fr-FR";
    voix.volume = 1;
    speechSynthesis.speak(voix);
  }catch(e){}
}

function ecouterTexte(){
  var boite = document.getElementById("boiteLia");
  if(!boite) return;
  var texte = boite.innerText.replace("🎧 Ecouter","").replace("X Fermer","").trim();
  if(!texte) return;
  try{
    speechSynthesis.cancel();
    var voix = new SpeechSynthesisUtterance(texte);
    voix.lang = "fr-FR";
    voix.volume = 1;
    speechSynthesis.speak(voix);
  }catch(e){}
}

document.addEventListener("click", function(e){
  if(e.target && e.target.innerText && e.target.innerText.includes("Ecouter")){
    ecouterTexte();
  }
});
</script>

</body>
</html>
